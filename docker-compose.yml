version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sports-connect-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sports_connect
      MYSQL_USER: sports_user
      MYSQL_PASSWORD: sports_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sports_user", "-psports_password_123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
